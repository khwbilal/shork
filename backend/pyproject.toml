[project]
name = "crypto-chart-ai"
version = "0.1.0"
description = "gptchart-style crypto analysis chat with TradingView data + Claude / Cursor / OpenAI"
requires-python = ">=3.10,<3.14"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
  "tradingview-mcp-server>=0.8.0",
  "anthropic>=1.17.0",
  "openai>=1.50.0",
  "cursor-sdk>=1.0.0",
]

[project.scripts]
crypto-chart-ai = "app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
# Ruff's default rule set only (pyflakes plus the core pycodestyle errors).
select = ["E4", "E7", "E9", "F"]
